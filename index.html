<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f3340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="數學觀念">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <meta name="app-version" content="2611101151">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css?v=2611101151">
  <title>數學觀念練習</title>
</head>
<body>
  <!-- 首頁 -->
  <section id="home" class="screen">
    <header class="topbar"><div class="title">數學觀念練習</div></header>
    <main class="home-body">
      <div class="stats">
        <div><span id="stat-total">0</span><small>全部題目</small></div>
        <div id="stat-weak-box"><span id="stat-weak" class="weak-num">0</span><small>不熟題目</small></div>
        <div id="stat-star-box"><span id="stat-star" class="star-num">0</span><small>星號題目</small></div>
      </div>

      <h3>題型</h3>
      <div class="seg" data-name="kind">
        <button data-value="concept">觀念題<small class="seg-note">不用計算</small></button>
        <button data-value="practice">計算・填空</button>
        <button data-value="all">全部</button>
      </div>

      <h3>範圍</h3>
      <div id="scope-src" class="chips src"></div>
      <p class="msg small sub-h">單元(可以選好幾個,不選 = 全部)</p>
      <div id="scope-topics" class="chips"></div>
      <p id="scope-info" class="msg small" style="margin-top:10px"></p>

      <h3>題數</h3>
      <div class="seg" data-name="count">
        <button data-value="10">10</button>
        <button data-value="20">20</button>
        <button data-value="40">40</button>
        <button data-value="all">全部</button>
      </div>

      <h3>答對/答錯音效</h3>
      <div class="seg" data-name="sound">
        <button data-value="on">開</button>
        <button data-value="off">關</button>
      </div>

      <p id="home-msg" class="msg"></p>
      <button id="btn-start" class="big-btn">開始練習</button>
      <button id="btn-notes" class="big-btn secondary">觀念整理</button>
      <button id="btn-reset" class="link-btn danger">清除所有練習紀錄</button>
      <p class="msg small ver">紀錄存在這台裝置的瀏覽器・版本 <span id="app-ver"></span></p>
    </main>
  </section>

  <!-- 測驗頁 -->
  <section id="quiz" class="screen">
    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="返回">‹</button>
      <div id="progress" class="title">1/20</div>
      <div class="top-right"><button id="btn-star" class="icon-btn star" aria-label="星號">☆</button></div>
    </header>
    <main class="quiz-body">
      <div class="q-card">
        <div id="q-tags" class="q-tags"></div>
        <div id="q-text" class="q-text"></div>
      </div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
    </main>
    <footer class="quiz-foot">
      <button id="btn-action" class="pill-btn hidden">下一題</button>
      <button id="btn-end" class="pill-btn">結 束</button>
    </footer>
  </section>

  <!-- 結果頁 -->
  <section id="result" class="screen">
    <header class="topbar"><div class="title">練習結果</div></header>
    <main class="home-body">
      <div class="score"><span id="score-pct">0%</span><small id="score-detail"></small></div>
      <h3 id="wrong-title">答錯的題目</h3>
      <ul id="wrong-list" class="word-list"></ul>
      <button id="btn-retry-wrong" class="big-btn">再練一次答錯的</button>
      <button id="btn-home" class="big-btn secondary">回首頁</button>
    </main>
  </section>

  <!-- 觀念整理 -->
  <section id="notes" class="screen">
    <header class="topbar">
      <button class="icon-btn btn-to-home" aria-label="返回">‹</button>
      <div class="title">觀念整理</div>
      <div class="top-right"></div>
    </header>
    <main class="home-body"><div id="notes-list"></div></main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="questions.js?v=2611101151"></script>
  <script src="app.js?v=2611101151"></script>
</body>
</html>
